# Public sync rules. Anything that names a real person, address, account or
# identifier belongs in ~/.config/portfolio-sync/private.toml, not here.

exclude_everywhere = [
    ".env", ".env.*", "*.db", "*.db-*", "*.pem", "credentials*.json", "token*.json",
    ".DS_Store", "*/.DS_Store", ".claude/settings.local.json",
]

# Published projects go in this folder of the repo.
publish_dir = "personal"

# The README project list, as headed groups in this order. A published project no group
# names goes at the end of the last group, alphabetically.
[[readme_group]]
title = "Personal projects"
projects = ["internship-search", "trip-planner", "apartment-chores", "life-dashboard"]

# Generic redactions, applied after the private ones.
[[redact]]
# Airtable base, table, view and share IDs.
pattern = '\b(app|tbl|viw|shr)[A-Za-z0-9]{14}\b'
replace = '\1XXXXXXXXXXXXXX'
scan = false

[[redact]]
# Google Calendar IDs for shared and subscribed calendars. Anyone holding one
# can read that calendar.
pattern = '\b[A-Za-z0-9._-]{16,}@(group|import)\.calendar\.google\.com\b'
replace = 'calendar-id@example.com'
scan = false

# Standing instructions written for a coding assistant, not for readers of this repo. These
# sentences describe how to explain changes and say nothing about what the code does.
[[redact]]
pattern = ',\s+and\s+he\s+is\s+not\s+a\s+computer\s+science\s+major,\s+so\s+explanations\s+matter\s+as\s+much\s+as\s+code\.'
replace = '.'
scan = false

[[redact]]
pattern = 'the\s+owner\s+is\s+an\s+economics\s+and\s+physics\s+double\s+major,\s+not\s+a\s+software\s+engineer\.\s+'
replace = ''
scan = false

[[redact]]
pattern = '\s+Assume\s+the\s+reader\s+is\s+not\s+an\s+engineer\.'
replace = ''
scan = false

[scan]
secret_patterns = [
    'sk-ant-[A-Za-z0-9_-]{10,}',
    'sk-[A-Za-z0-9]{32,}',
    'gh[opsu]_[A-Za-z0-9]{30,}',
    'github_pat_[A-Za-z0-9_]{30,}',
    'AKIA[0-9A-Z]{16}',
    'AIza[0-9A-Za-z_-]{35}',
    'xox[abpr]-[A-Za-z0-9-]{10,}',
    'pat[A-Za-z0-9]{14}\.[a-f0-9]{40,}',
    '-----BEGIN [A-Z ]*PRIVATE KEY-----',
    '''(?i)(client_secret|app_password|api_key)\s*[:=]\s*["'][A-Za-z0-9_/+=-]{16,}["']''',
    '\b(app|tbl|viw|shr)(?!X{14})[A-Za-z0-9]{14}\b',
]
deny_patterns = [
    'GPA\s*[:=]?\s*\d\.\d',
    '\d\.\d+\s*GPA',
]
# Domains used only by fake addresses in tests and docs.
email_allow_domains = [
    "example.com", "example.org", "example.edu", "example.net", "test",
    "greenhouse.io",
]
# Individual fake addresses from test fixtures, reviewed by hand.
email_allow = [
    "a@b.com",
    "a@uchicago.edu",
    "a@x.com",
    "a1@mail.gmail.com",
    "alerts@bank.com",
    "alice@uchicago.edu",
    "b@uchicago.edu",
    "b@y.com",
    "bob@uchicago.edu",
    "bot@gmail.com",
    "c@uchicago.edu",
    "deals@shop.com",
    "hi@store.com",
    "landlord@gmail.com",
    "lord@gmail.com",
